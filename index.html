<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <div class="container">
        <!-- START SCREEN -->
        <div class="screen active" id="start-screen">
          <span class="eyebrow">Trivia Challenge</span>
          <h1 class="headline">
            Quiz
            <span class="highlight">
              Time
              <svg class="squiggle" viewBox="0 0 130 14" preserveAspectRatio="none" aria-hidden="true">
                <path d="M2,8 Q17,-1 32,8 T62,8 T92,8 T122,8" fill="none" stroke-width="4" stroke-linecap="round" />
              </svg>
            </span>
          </h1>
          <p class="subtext">Pick your battleground, then see how much you really know.</p>

          <div class="field-group">
            <span class="field-label">Category</span>
            <div class="chip-group" id="category-group" data-value="">
              <button type="button" class="chip selected" data-value="">Any</button>
              <button type="button" class="chip" data-value="18">Computers</button>
              <button type="button" class="chip" data-value="23">History</button>
              <button type="button" class="chip" data-value="21">Sports</button>
              <button type="button" class="chip" data-value="22">Geography</button>
              <button type="button" class="chip" data-value="17">Science &amp; Nature</button>
              <button type="button" class="chip" data-value="12">Music</button>
              <button type="button" class="chip" data-value="11">Film</button>
              <button type="button" class="chip" data-value="9">General Knowledge</button>
            </div>
          </div>

          <div class="field-group">
            <span class="field-label">Difficulty</span>
            <div class="chip-group" id="difficulty-group" data-value="">
              <button type="button" class="chip selected" data-value="">Any</button>
              <button type="button" class="chip" data-value="easy">Easy</button>
              <button type="button" class="chip" data-value="medium">Medium</button>
              <button type="button" class="chip" data-value="hard">Hard</button>
            </div>
          </div>

          <div class="field-group">
            <span class="field-label">Number of Questions</span>
            <div class="chip-group" id="amount-group" data-value="5">
              <button type="button" class="chip selected" data-value="5">5</button>
              <button type="button" class="chip" data-value="10">10</button>
              <button type="button" class="chip" data-value="15">15</button>
              <button type="button" class="chip" data-value="20">20</button>
            </div>
          </div>

          <button id="start-btn" class="primary-btn">Start Quiz</button>
        </div>

        <!-- QUIZ SCREEN -->
        <div class="screen" id="quiz-screen">
          <div class="quiz-header">
            <h2 id="question-text">Question goes here</h2>
            <div class="quiz-info">
              <p>Question <span id="current-question">1</span> of <span id="total-questions">5</span></p>
              <p>Score: <span id="score">0</span></p>
            </div>
          </div>

          <div id="answers-container" class="answers-container">
            <!-- Answer buttons will be inserted here from our js code later at some point -->
          </div>

          <div class="progress-bar">
            <div id="progress" class="progress"></div>
          </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="screen">
          <span class="eyebrow">All Done</span>
          <h1 class="headline result-headline">Results</h1>
          <div class="result-info">
            <p class="result-score">
              <span id="final-score">0</span><span class="result-score-max">/ <span id="max-score">5</span></span>
            </p>
            <div id="result-message">Good job!</div>
          </div>
          <button id="restart-btn" class="primary-btn">Restart Quiz</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
