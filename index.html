<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <div class="container">
        <!-- LANGUAGE SWITCHER -->
        <div class="lang-switcher-row">
          <button type="button" class="lang-switch" id="lang-switch" data-active="en" aria-label="Toggle language">
            <span class="lang-switch-knob"></span>
            <span class="lang-switch-text lang-switch-text-en">EN</span>
            <span class="lang-switch-text lang-switch-text-fa">فا</span>
          </button>
        </div>

        <!-- START SCREEN -->
        <div class="screen active" id="start-screen">
          <span class="eyebrow" data-i18n="eyebrowStart">Trivia Challenge</span>
          <h1 class="headline">
            <span data-i18n="headlinePrefix">Quiz</span>
            <span class="highlight" data-i18n="headlineHighlight">Time</span>
          </h1>
          <p class="subtext" data-i18n="subtext">Pick your battleground, then see how much you really know.</p>

          <div class="field-group">
            <span class="field-label" data-i18n="labelCategory">Category</span>
            <div class="chip-group" id="category-group" data-value="">
              <button type="button" class="chip selected" data-value="" data-i18n="chipAny">Any</button>
              <button type="button" class="chip" data-value="18" data-i18n="chipComputers">Computers</button>
              <button type="button" class="chip" data-value="23" data-i18n="chipHistory">History</button>
              <button type="button" class="chip" data-value="21" data-i18n="chipSports">Sports</button>
              <button type="button" class="chip" data-value="22" data-i18n="chipGeography">Geography</button>
              <button type="button" class="chip" data-value="17" data-i18n="chipScienceNature">Science &amp; Nature</button>
              <button type="button" class="chip" data-value="12" data-i18n="chipMusic">Music</button>
              <button type="button" class="chip" data-value="11" data-i18n="chipFilm">Film</button>
              <button type="button" class="chip" data-value="9" data-i18n="chipGeneral">General Knowledge</button>
            </div>
          </div>

          <div class="field-group">
            <span class="field-label" data-i18n="labelDifficulty">Difficulty</span>
            <div class="chip-group" id="difficulty-group" data-value="">
              <button type="button" class="chip selected" data-value="" data-i18n="chipAny">Any</button>
              <button type="button" class="chip" data-value="easy" data-i18n="chipEasy">Easy</button>
              <button type="button" class="chip" data-value="medium" data-i18n="chipMedium">Medium</button>
              <button type="button" class="chip" data-value="hard" data-i18n="chipHard">Hard</button>
            </div>
          </div>

          <div class="field-group">
            <span class="field-label" data-i18n="labelAmount">Number of Questions</span>
            <div class="chip-group" id="amount-group" data-value="5">
              <button type="button" class="chip selected" data-value="5">5</button>
              <button type="button" class="chip" data-value="10">10</button>
              <button type="button" class="chip" data-value="15">15</button>
              <button type="button" class="chip" data-value="20">20</button>
            </div>
          </div>

          <button id="start-btn" class="primary-btn" data-i18n="btnStart">Start Quiz</button>
        </div>

        <!-- QUIZ SCREEN -->
        <div class="screen" id="quiz-screen">
          <div class="quiz-header">
            <h2 id="question-text">Question goes here</h2>
            <div class="quiz-info">
              <p>
                <span data-i18n="quizQuestionWord">Question</span>
                <span id="current-question">1</span>
                <span data-i18n="quizOfWord">of</span>
                <span id="total-questions">5</span>
              </p>
              <p><span data-i18n="labelScore">Score:</span> <span id="score">0</span></p>
            </div>
          </div>

          <div id="answers-container" class="answers-container">
            <!-- Answer buttons will be inserted here from our js code later at some point -->
          </div>

          <div class="progress-bar">
            <div id="progress" class="progress"></div>
          </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="screen">
          <span class="eyebrow" data-i18n="eyebrowResult">All Done</span>
          <h1 class="headline result-headline" data-i18n="headlineResults">Results</h1>
          <div class="result-info">
            <p class="result-score">
              <span id="final-score">0</span><span class="result-score-max">/ <span id="max-score">5</span></span>
            </p>
            <div id="result-message">Good job!</div>
          </div>
          <button id="restart-btn" class="primary-btn" data-i18n="btnRestart">Restart Quiz</button>
        </div>
      </div>
    </div>

    <script src="script.js?v=5"></script>
  </body>
</html>
